# Runs the scenarios in scenarios.yaml against your agent on LiveKit Cloud.
# Simulations spend real inference, so this runs on merges to main and on demand.
#
# Run locally while developing:
# lk agent simulate --scenarios scenarios.yaml

name: Simulations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install pnpm
      # ---------------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      # ---------------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ---------------------------------------------------------
      # Install project dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------
      # Install LiveKit CLI
      # ---------------------------------------------------------
      - name: Install LiveKit CLI
        run: |
          VERSION="2.18.6"

          curl -fL \
            "https://github.com/livekit/livekit-cli/releases/download/v${VERSION}/lk_${VERSION}_linux_amd64.tar.gz" \
            -o livekit-cli.tar.gz

          tar -xzf livekit-cli.tar.gz

          sudo mv lk /usr/local/bin/lk
          sudo chmod +x /usr/local/bin/lk

          rm livekit-cli.tar.gz

          echo "LiveKit CLI installed successfully:"
          lk --version

      # ---------------------------------------------------------
      # Verify required LiveKit credentials
      # ---------------------------------------------------------
      - name: Check LiveKit credentials
        run: |
          if [ -z "$LIVEKIT_URL" ]; then
            echo "LIVEKIT_URL is missing"
            exit 1
          fi

          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "LIVEKIT_API_KEY is missing"
            exit 1
          fi

          if [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "LIVEKIT_API_SECRET is missing"
            exit 1
          fi

          echo "All LiveKit credentials are available"

      # ---------------------------------------------------------
      # Run LiveKit simulations
      # ---------------------------------------------------------
      - name: Run simulations
        run: |
          lk agent simulate --scenarios scenarios.yaml
