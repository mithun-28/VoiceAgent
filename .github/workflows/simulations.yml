name: Simulations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LiveKit CLI
        run: |
          VERSION="2.18.6"

          curl -fL \
            "https://github.com/livekit/livekit-cli/releases/download/v${VERSION}/lk_${VERSION}_linux_amd64.tar.gz" \
            -o livekit-cli.tar.gz

          tar -xzf livekit-cli.tar.gz

          sudo mv lk /usr/local/bin/lk
          sudo chmod +x /usr/local/bin/lk

          rm livekit-cli.tar.gz

          lk --version

      - name: Check required secrets
        run: |
          if [ -z "$LIVEKIT_URL" ]; then
            echo "LIVEKIT_URL is missing"
            exit 1
          fi

          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "LIVEKIT_API_KEY is missing"
            exit 1
          fi

          if [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "LIVEKIT_API_SECRET is missing"
            exit 1
          fi

          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI is missing"
            exit 1
          fi

          if [ -z "${{ secrets.SARVAM_API_KEY }}" ]; then
            echo "SARVAM_API_KEY is missing"
            exit 1
          fi

          echo "All required secrets are available"

      - name: Create environment file
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          printf '%s\n' "MONGODB_URI=$MONGODB_URI" > .env.local
          printf '%s\n' "sarvam_api_key=$SARVAM_API_KEY" >> .env.local

      - name: Run simulations
        run: |
          lk agent simulate --scenarios scenarios.yaml